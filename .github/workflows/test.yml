# Runs the tests of the stats page's arithmetic and of the backend's parsing
# on every push and pull request. Nothing is deployed from here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Page arithmetic
        run: node --test tests/*.test.mjs
      - name: Backend
        working-directory: functions
        run: |
          npm ci
          node --check index.js
          npm test
